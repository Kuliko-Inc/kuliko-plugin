name: Package regression check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tool-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_tool_references.py
      - run: python3 -m unittest discover -s tests -v
